name: Terraform Step1 Secrets

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - terraform/step1-secrets/**
      - .github/workflows/terraform-step1-secrets.yml

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      AWS_REGION: ap-southeast-2
      TF_VAR_aws_region: ap-southeast-2
      TF_VAR_secret_name: github/issue-resolver-mate-pat
      TF_VAR_github_pat: ${{ secrets.GH_PAT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate required GitHub PAT secret
        run: |
          if [ -z "$TF_VAR_github_pat" ]; then
            echo "Missing repository secret: GH_PAT"
            exit 1
          fi

      - name: Terraform init
        working-directory: terraform/step1-secrets
        run: terraform init -input=false

      - name: Terraform apply
        working-directory: terraform/step1-secrets
        run: terraform apply -auto-approve -input=false
