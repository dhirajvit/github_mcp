name: Terraform Step2 AgentCore

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - hello-mcp/**
      - requirements.txt
      - .dockerignore
      - terraform/step2-agentcore/**
      - .github/workflows/terraform-step2-agentcore.yml

concurrency:
  group: terraform-step2-agentcore
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      AWS_REGION: ap-southeast-2
      TF_VAR_aws_region: ap-southeast-2
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test MCP server
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s hello-mcp -p 'test_*.py'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: "365957109972"

      - name: Initialize and validate Terraform
        working-directory: terraform/step2-agentcore
        run: |
          terraform fmt -check -diff
          terraform init -input=false
          terraform validate

      - name: Bootstrap ECR repository if needed
        working-directory: terraform/step2-agentcore
        run: |
          terraform state pull > "$RUNNER_TEMP/step2-state.json"
          if [ -s "$RUNNER_TEMP/step2-state.json" ]; then
            terraform state list > "$RUNNER_TEMP/step2-resources.txt"
          else
            : > "$RUNNER_TEMP/step2-resources.txt"
          fi
          if ! grep -Fxq 'aws_ecr_repository.mcp_server' "$RUNNER_TEMP/step2-resources.txt"; then
            terraform apply -auto-approve -input=false -lock-timeout=5m -target=aws_ecr_repository.mcp_server
          fi

      - name: Set image details
        working-directory: terraform/step2-agentcore
        run: |
          echo "ECR_REPOSITORY_URL=$(terraform output -raw ecr_repository_url)" >> "$GITHUB_ENV"
          echo "TF_VAR_image_tag=${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ARM64 image
        run: |
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "${ECR_REPOSITORY_URL%%/*}"
          docker buildx build --platform linux/arm64 --provenance=false --push \
            -f hello-mcp/Dockerfile -t "$ECR_REPOSITORY_URL:$TF_VAR_image_tag" .

      - name: Plan and apply AgentCore Terraform
        working-directory: terraform/step2-agentcore
        run: |
          terraform plan -input=false -lock-timeout=5m -out="$RUNNER_TEMP/step2.tfplan"
          terraform apply -input=false -lock-timeout=5m "$RUNNER_TEMP/step2.tfplan"
          terraform output agent_runtime_arn
